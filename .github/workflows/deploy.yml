name: Deploy AirDraw to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify static export
        run: |
          test -f out/index.html
          echo "Static export generated: out/index.html"
      - name: Self-host MediaPipe WASM and face/hand models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/mediapipe/wasm out/mediapipe/models
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_internal.js out/mediapipe/wasm/
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_internal.wasm out/mediapipe/wasm/
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_nosimd_internal.js out/mediapipe/wasm/
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_nosimd_internal.wasm out/mediapipe/wasm/
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            --output out/mediapipe/models/hand_landmarker.task
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" \
            --output out/mediapipe/models/face_landmarker.task
          test -s out/mediapipe/models/hand_landmarker.task
          test -s out/mediapipe/models/face_landmarker.task
          test -s out/mediapipe/wasm/vision_wasm_internal.wasm
          echo "All locally hosted tracking assets are in out/mediapipe."
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
